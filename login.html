<!DOCTYPE html>

<head>

    <title>Entrar | Companhia de Viagem</title>

                </div>

                <a href="#" class="esqueci-senha">Esqueci minha senha</a>
                <a href="home.html" class="botao botao--dourado">Entrar</a>
            </form>

            <div class="divisor">ou continue com</div>

             <div class="login-social">
